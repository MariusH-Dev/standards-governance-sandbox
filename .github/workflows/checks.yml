name: checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  tsc:
    name: tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit -p .
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx eslint src
  forbidden-edge:
    name: forbidden-edge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx depcruise src -T json > dc.json || true; node scripts/dc-guard.mjs domain-not-to-infra < dc.json
  cycle:
    name: cycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx depcruise src -T json > dc.json || true; node scripts/dc-guard.mjs no-circular < dc.json
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx vitest run
  gate:
    name: gate
    if: always()
    needs: [tsc, lint, forbidden-edge, cycle, test]
    runs-on: ubuntu-latest
    steps:
      - name: provenance
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: echo "provenance github_sha=$GITHUB_SHA pr_head=$PR_HEAD pr_base=$PR_BASE"
      - name: complete job list succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
          const required = ["tsc", "lint", "forbidden-edge", "cycle", "test"];
          const needs = JSON.parse(process.env.NEEDS);
          const bad = required.filter((job) => needs[job]?.result !== "success");
          if (bad.length > 0) { console.error("not successful: " + bad.join(", ")); process.exit(1); }
          '
